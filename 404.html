<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Página não encontrada | Proton Engenharia</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #e5eefc;
    }
    .card {
      max-width: 680px;
      padding: 32px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      background: rgba(255,255,255,.04);
      box-shadow: 0 18px 40px rgba(0,0,0,.24);
    }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    p { line-height: 1.6; margin: 0 0 16px; color: rgba(229,238,252,.88); }
    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      background: #1d4ed8;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Página não encontrada</h1>
    <p>A URL solicitada não existe no site. Esta página orienta os buscadores a não indexarem endereços inexistentes.</p>
    <a href="/">Voltar para a home</a>
  </main>
</body>
</html>
